start_layout = "main"
stick_scale_x = 3.8
stick_scale_y = 2.8
stick_warp = 1.0
preferred_controller = ["sc2"]
transparent = true
keyboard_opacity = 0.3
ui_opacity = 0.92
window_pos = "mouse pointer"
scale_x = 30.0
scale_y = 32.0
event_debounce_ms = 240
event_debounce_repeat_ms = 55
stick_select_lock_ms = 100
# Current key keeps the highlight until a neighbor is this times closer (1 = off).
stick_select_sticky = 1.25
controller_map = "mappings.toml"
record_file = "captures/kosk-%.krec"

[sc2]
# How a thumb on a pad aims the keyboard highlight.
#
# pad_origin_relative (0–1): what "rest" means when you put your thumb down.
#   0 — pad location is the key. Landing on the upper-right of the pad
#       highlights an upper-right key, not the home-row rest key.
#   1 — the first contact *is* rest. Highlight starts on that pad's home-row
#       key and only moves as you slide from where you landed.
#   Values in between mix those, so the first highlight sits part-way between
#   the pad spot and home-row rest. Out of range is clamped.
#
# pad_origin_stretch (0–1): leftover travel when rest is not the pad center.
#   One slide direction then has less pad left. 0 keeps movement 1:1 with the
#   thumb, so you can run out of pad before the far keys. 1 speeds up only
#   that short leftover direction so far keys stay reachable. The long
#   leftover side is not slowed down. Out of range is clamped.
#
# pad_origin_stretch_max_gain: cap on that speed-up. 1 = none; below 1 is
#   treated as 1. A thumb on the rim still cannot cover the whole half-keyboard;
#   this only limits how twitchy the last millimeters feel.
#
# pad_origin_settle_ms: wait this long after contact before freezing the start
#   point, so the first noisy sample is not treated as rest.
pad_origin_relative = 0.6
pad_origin_stretch = 1.0
pad_origin_stretch_max_gain = 1.5
pad_origin_settle_ms = 20
trigger_left_threshold = 40
trigger_right_threshold = 40
touchpad_left_haptic = "low"
touchpad_right_haptic = "low"

[ps4]
trigger_left_threshold = 40
trigger_right_threshold = 40

[battery]
draw_button = false
empty = [220, 50, 50, 255]
low = [230, 140, 40, 255]
medium = [230, 200, 60, 255]
high = [120, 190, 80, 255]
full = [50, 200, 90, 255]
charging = [70, 180, 220, 255]
unknown = [180, 180, 180, 255]

[replay]
file = "captures/kosk-000.krec"

[layouts]
main = "old_sc.toml"
symbols = "old_sc_symbols.toml"

[debug]
show_stick_cursors = true
show_hitboxes = false
show_stick_bounds = false
reach_overlay = "none"

[text_input]
background_color = [255, 255, 255, 255]
text_color = [0, 0, 0, 255]
cursor_color = [0, 0, 0, 255]
font_size = 22.0
