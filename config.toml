start_layout = "main"
stick_scale_x = 3.8
stick_scale_y = 2.8
stick_warp = 1.0
preferred_controller = ["sc2"]
transparent = true
keyboard_opacity = 1.00
ui_opacity = 1.00
window_pos = "mouse pointer"
scale_x = 30.0
scale_y = 32.0
event_debounce_ms = 240
event_debounce_repeat_ms = 55
stick_select_lock_ms = 100
# Current key keeps the highlight until a neighbor is this times closer (1 = off).
stick_select_sticky = 1.25
controller_map = "mappings.toml"
record_file = "captures/kosk-%.krec"

[sc2]
# How a thumb on a pad aims the keyboard highlight.
#
# pad_origin_relative (0–1): what "rest" means when you put your thumb down.
#   0 — pad location is the key. Landing on the upper-right of the pad
#       highlights an upper-right key, not the home-row rest key.
#   1 — the first contact *is* rest. Highlight starts on that pad's home-row
#       key and only moves as you slide from where you landed.
#   Values in between mix those, so the first highlight sits part-way between
#   the pad spot and home-row rest. Out of range is clamped.
#
# pad_origin_stretch (0–1): leftover travel when rest is not the pad center.
#   One slide direction then has less pad left. 0 keeps movement 1:1 with the
#   thumb, so you can run out of pad before the far keys. 1 speeds up only
#   that short leftover direction so far keys stay reachable. The long
#   leftover side is not slowed down. Out of range is clamped.
#
# pad_origin_stretch_max_gain: cap on that speed-up. 1 = none; below 1 is
#   treated as 1. A thumb on the rim still cannot cover the whole half-keyboard;
#   this only limits how twitchy the last millimeters feel.
#
# pad_origin_settle_ms: wait this long after contact before freezing the start
#   point, so the first noisy sample is not treated as rest.
pad_origin_relative = 0.6
pad_origin_stretch = 1.0
pad_origin_stretch_max_gain = 1.5
pad_origin_settle_ms = 20
trigger_left_threshold = 40
trigger_right_threshold = 40
touchpad_left_haptic = "low"
touchpad_right_haptic = "low"

[ps4]
trigger_left_threshold = 40
trigger_right_threshold = 40

[battery]
draw_button = false
empty = [220, 50, 50, 255]
low = [230, 140, 40, 255]
medium = [230, 200, 60, 255]
high = [120, 190, 80, 255]
full = [50, 200, 90, 255]
charging = [70, 180, 220, 255]
unknown = [180, 180, 180, 255]

[replay]
file = "captures/kosk-000.krec"

[layouts]
main = "old_sc.toml"
symbols = "old_sc_symbols.toml"

[debug]
show_stick_cursors = true
show_hitboxes = false
show_stick_bounds = false
reach_overlay = "none"

[text_input]
background_color = [255, 255, 255, 255]
text_color = [0, 0, 0, 255]
cursor_color = [0, 0, 0, 255]
font_size = 22.0

[completion]
enabled = true
show_in_keyboard = true
show_in_text_input = true
backend = "ngram"
fallback = "dictionary"
locale = "en"
max_suggestions = 3
min_prefix_len = 1
debounce_ms = 16
suggest_next_word = true
insert_space_on_accept = true
mix_unmatched_next_word = false
preselect = "none"
reset_highlight_on_refresh = true
highlight_wraps = true
learn_on_accept = true
learn_on_submit = true
unicode_letters = true
extra_word_chars = "_'"
normalize_nfc = true

[completion.ui]
placement = "between"
columns = 3
rows = 1
reserve_slots = true
chip_width = "fill"
max_chip_width = 200.0
min_chip_width = 48.0
font_size = 18.0
corner_radius = 6.0
background_color = [40, 40, 40, 255]
text_color = [230, 230, 230, 255]
selected_background_color = [50, 100, 180, 255]
selected_text_color = [255, 255, 255, 255]
selected_outline_width = 2.0
padding_x = 10.0
padding_y = 4.0
gap = 6.0
label = "full"
dim_typed_prefix = true
empty_slot_background = [30, 30, 30, 255]
show_debug_scores = false
armed_dot = true
armed_dot_radius = 4.0
armed_dot_placement = "chips_leading"
armed_color = [50, 200, 90, 255]
disarmed_color = [128, 128, 128, 255]

[completion.text_input]
preview_on_highlight = false

[completion.keyboard]
accept_via = "suffix"
retract_last_accept = true
track_backspace = true
clear_on_enter = true
ignore_ctrl_alt = true
start_armed = true
latch_off_on_arrow = true
latch_off_on_paste = true
clear_log_on_arm = true
max_chars = 2048
idle_reset_ms = 0

[completion.dictionary]
wordlist = "data/completion/en/unigrams.tsv"

[completion.ngram]
model_dir = "data/completion/en"
order = 3
backoff_alpha = 0.4
lambda_trigram = 1.0
lambda_bigram = 0.3
lambda_unigram = 0.2
lambda_user = 0.8
lambda_exact = 0.1
prefix_scan_limit = 8192
abort_check_every = 64
precomputed_prefix_depth = 2

[completion.user_cache]
enabled = true
path = "completion-cache.bin"
decay_tau_hours = 2.0
max_unigrams = 20000
max_bigrams = 50000
persist_interval_s = 30
