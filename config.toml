config_version = 1
start_layout = "main"
stick_scale_x = 3.8
stick_scale_y = 2.8
stick_warp = 1.0
preferred_controller = ["sc2"]
transparent = true
keyboard_opacity = 1.00
ui_opacity = 1.00
window_pos = "mouse pointer"
scale_x = 30.0
scale_y = 32.0
event_debounce_ms = 240
event_debounce_repeat_ms = 55
stick_select_lock_ms = 100
# Current key keeps the highlight until a neighbor is this times closer (1 = off).
stick_select_sticky = 1.25
controller_map = "mappings.toml"
record_file = "captures/kosk-%.krec"

[sc2]
# How a thumb on a pad aims the keyboard highlight.
#
# pad_origin_relative (0–1): what "rest" means when you put your thumb down.
#   0 — pad location is the key. Landing on the upper-right of the pad
#       highlights an upper-right key, not the home-row rest key.
#   1 — the first contact *is* rest. Highlight starts on that pad's home-row
#       key and only moves as you slide from where you landed.
#   Values in between mix those, so the first highlight sits part-way between
#   the pad spot and home-row rest. Out of range is clamped.
#
# pad_origin_stretch (0–1): leftover travel when rest is not the pad center.
#   One slide direction then has less pad left. 0 keeps movement 1:1 with the
#   thumb, so you can run out of pad before the far keys. 1 speeds up only
#   that short leftover direction so far keys stay reachable. The long
#   leftover side is not slowed down. Out of range is clamped.
#
# pad_origin_stretch_max_gain: cap on that speed-up. 1 = none; below 1 is
#   treated as 1. A thumb on the rim still cannot cover the whole half-keyboard;
#   this only limits how twitchy the last millimeters feel.
#
# pad_origin_settle_ms: wait this long after contact before freezing the start
#   point, so the first noisy sample is not treated as rest.
pad_origin_relative = 0.6
pad_origin_stretch = 1.0
pad_origin_stretch_max_gain = 1.5
pad_origin_settle_ms = 20
trigger_left_threshold = 40
trigger_right_threshold = 40
touchpad_left_haptic = "low"
touchpad_right_haptic = "low"

[ps4]
trigger_left_threshold = 40
trigger_right_threshold = 40

[battery]
draw_button = false
empty = [220, 50, 50, 255]
low = [230, 140, 40, 255]
medium = [230, 200, 60, 255]
high = [120, 190, 80, 255]
full = [50, 200, 90, 255]
charging = [70, 180, 220, 255]
unknown = [180, 180, 180, 255]

[replay]
file = "captures/kosk-000.krec"

[layouts]
main = "old_sc.toml"
symbols = "old_sc_symbols.toml"

[debug]
show_stick_cursors = true
show_hitboxes = false
show_stick_bounds = false
reach_overlay = "none"

[text_input]
background_color = [255, 255, 255, 255]
text_color = [0, 0, 0, 255]
cursor_color = [0, 0, 0, 255]
font_size = 22.0

[completion]
# Word suggestions. Omitted keys use the defaults shown. Relative paths
# resolve against this file's directory. Not stored in recordings.
#
# enabled: false hides the suggestions. true keeps reserved slots
# so key centres do not jump when suggestions are empty or off.
enabled = true
# Draw suggestions in Keyboard mode (from keys sent to the app).
show_in_keyboard = true
# Draw suggestions in TextInput (the field you are composing).
show_in_text_input = true
# Predictor: ngram | dictionary. ngram needs vocab.txt + unigrams.bin in
# model_dir (from completion_build); otherwise it uses the wordlist.
backend = "ngram"
# If the chosen predictor fails to load: ngram | dictionary.
fallback = "dictionary"
# Suggestion cap. UI shows at most columns * rows of these.
# Raise together with columns/rows to show a correction plus completions
# (e.g. max_suggestions = 6 with columns = 3 and rows = 2).
max_suggestions = 6
# Ignore tokens shorter than this (characters). 0 allows next-word only.
min_prefix_len = 1
# Wait this long after typing before refreshing suggestions (ms).
debounce_ms = 16
# Empty token (after a space): suggest the next word.
suggest_next_word = true
# Append a space after an accepted word.
insert_space_on_accept = true
# Next key after accept: delete that space if the key is in this set.
# Empty string disables.
eat_space_before = ",.!?;:)]}'\"/"
# After eating, insert a space after the mark if it is in this set.
# Must also be in eat_space_before. Empty string never re-spaces.
space_after = ",.!?;:"
# Highlight at rest: none | first. none = no suggestion highlighted until cycle or click.
preselect = "none"
# If a highlighted suggestion is gone after refresh, clear it (or apply preselect).
# Same suggestion still in the list: keep it, even if it moved.
reset_highlight_on_refresh = true
# Cycle wrap: last → first (and reverse). false clamps at the ends.
highlight_wraps = true
# Mix accepted suggestion text into the user cache.
learn_on_accept = true
# Mix a submitted line (TextInput) or Enter (Keyboard) into the user cache.
learn_on_submit = true
# first | last. Show an unknown typed token as a suggestion; accept adds a space and learns it.
current_word_chip = "last"
# Token letters: unicode alphanumeric vs ASCII only.
unicode_letters = true
# Extra characters that count as inside a word (apostrophe, underscore).
extra_word_chars = "_'"
# Treat equivalent unicode spellings as the same.
normalize_nfc = true
# Restore model lowercase to HEL / Hel / sentence-start. Default true; omit ok.
# capitalization = true
# Distance-1 typos: neighbor subst, adjacent transpose, omitted/extra key.
typo_tolerance = true
# Min token length (characters) for subst / omit / extra-key. Transpose still at length 2.
min_fuzzy_len = 3
# If true, only transpose keys that are layout neighbors. false allows wehn → when.
transpose_neighbors_only = false

[completion.ui]
# Keyboard: always above the keys. TextInput: between = field, strip, keys;
# above_field = strip, field, keys; above_keyboard = same as between.
placement = "between"
# Suggestions per row, left to right. Extra hits past columns*rows are dropped.
# Correction + completions: raise rows (e.g. 2) and max_suggestions together.
# reserve_slots sizes the strip to this grid even when empty (key centres stay put).
columns = 3
rows = 2
# Allocate the full grid (and on/off dot) even when nothing is suggested.
reserve_slots = true
# fill = equal share of keyboard content width (minus dot + gaps).
# hug = size to text, capped by max_chip_width.
chip_width = "fill"
# Hug cap. Fill ignores this.
max_chip_width = 200.0
# Floor for both fill and hug.
min_chip_width = 48.0
font_size = 14.0
corner_radius = 6.0
# RGBA 0–255.
background_color = [40, 40, 40, 255]
text_color = [230, 230, 230, 255]
selected_background_color = [50, 100, 180, 255]
selected_text_color = [255, 255, 255, 255]
selected_outline_width = 2.0
padding_x = 10.0
padding_y = 4.0
gap = 6.0
# Suggestion text: full word | remainder only (typed prefix stripped).
label = "full"
# When label=full, paint the already-typed prefix darker.
dim_typed_prefix = true
# Color of unused reserved slots.
empty_slot_background = [30, 30, 30, 255]
# Paint the ranking score on each suggestion.
show_debug_scores = false
# Green/gray circle on the strip: suggestions on vs off.
armed_dot = true
armed_dot_radius = 4.0
# chips_leading | chips_trailing (first row only).
armed_dot_placement = "chips_leading"
armed_color = [50, 200, 90, 255]
disarmed_color = [128, 128, 128, 255]
# + before a current-word suggestion (unknown token).
new_word_mark_color = [50, 200, 90, 255]

# App types: free names, exclusive exe basenames, optional wordlist TSV.
# Processes not listed use an implicit catch-all (do not declare a type named *).
# [completion.app_types.browser]
# exes = ["firefox.exe", "chrome.exe"]
# wordlist = "data/completion/browser.tsv"
#
# [completion.app_types.programming]
# exes = ["code.exe"]
# wordlist = "data/completion/programming.tsv"

[completion.keyboard]
# How accept injects into the focused app: suffix = send the untyped tail
# (hel + hello → lo). backspace_replace = delete the token, then send the word.
# Non-prefix suggestions (typo corrections) always use backspace_replace.
accept_via = "suffix"
# cancelSuggestion undoes the last accept only while that accept is still
# the latest edit and no suggestion is highlighted (retypes a replaced token).
# Backing out of a highlighted suggestion only clears the highlight.
# false: cancel never undoes an accept.
retract_last_accept = true
# Backspace also forgets that character for suggestions.
track_backspace = true
# On Enter, forget suggestion context if still on. Does not turn suggestions back on.
clear_on_enter = true
# Ctrl/Alt letter chords: ignore for suggestions. Do not turn suggestions off (only paste does).
ignore_ctrl_alt = true
# At start: suggestion context empty and suggestions on.
start_armed = true
# Arrow / Home / End / PageUp / PageDown / Insert / Delete: hide suggestions until toggleCompletion.
latch_off_on_arrow = true
# Paste (Ctrl+V): same, hide suggestions until toggleCompletion.
latch_off_on_paste = true
# Turning suggestions back on wipes old context (it is stale).
clear_log_on_arm = true
# Drop oldest characters from suggestion context past this length.
max_chars = 2048
# 0 = off. Else forget suggestion context after this idle (ms).
idle_reset_ms = 0

[completion.dictionary]
# word or word<TAB>count. Used when backend is dictionary, and as ngram
# fallback when model_dir has no vocab.txt / unigrams.bin.
wordlist = "data/completion/en/unigrams.tsv"

[completion.ngram]
# Packed tables from completion_build: vocab.txt, unigrams.bin, optional
# bigrams.bin / trigrams.bin. Without pair tables, next-word stays you/i/the.
# See README "Completion next-word setup".
model_dir = "data/completion/en"
# How many previous words to use (3 for trigrams).
order = 3
# If a longer pattern was never seen, fall back to a shorter one, scaled by this.
backoff_alpha = 0.4
# How much each source counts toward a suggestion's score.
# lambda_exact if the candidate equals the token.
# lambda_typo if the candidate is a correction, not an exact prefix.
lambda_trigram = 1.0
lambda_bigram = 0.3
lambda_unigram = 0.2
lambda_exact = 0.1
lambda_typo = -2.0
# Cap how many words a prefix scan considers, and how often to drop a stale scan.
prefix_scan_limit = 8192
abort_check_every = 64

[completion.user_cache]
# Lifetime counts of accepted / submitted words. Novel words complete
# without rebuilding the packed tables. File is next to this config if relative.
# Cache mass is mixed into dictionary counts so a few accepts cannot bury
# high-frequency English; caps drop the rarest entries when full.
enabled = true
path = "completion-cache.bin"
max_unigrams = 20000
max_bigrams = 50000
