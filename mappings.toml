# What each controller button does. config.toml names this file as controller_map.
#
# Each [Heading] is a screen (the on-screen keyboard, the menu, and so on).
# Left of = is a button. Right of = is what that button does on that screen.
# Names ignore case: faceBottom and face-bottom are the same button.
#
# Two buttons with + is a chord: hold the first, then press the second.
# The first button cannot also have its own line here; the second can.
#
# Same button, two jobs: a list. The first line whose when is true (or omitted)
# wins. Put the default last, with no when. A lone { action, when } does
# nothing when the condition is false. Condition names: docs/bindings.md.
#
# Steam Controller 2 extra buttons (l4, r5, quickAccess / qam) do nothing on a
# DualShock 4. How far you pull a trigger is [ps4] / [sc2] in config.toml.

[Keyboard]
"triggerLeft" = [
  { action = "acceptSuggestion", when = "suggestionSelected" },
  { action = "sendKeyUnderLeftStick" },
]
"triggerRight" = [
  { action = "acceptSuggestion", when = "suggestionSelected" },
  { action = "sendKeyUnderRightStick" },
]
"padLeft" = "sendKeyUnderLeftStick"
"padRight" = "sendKeyUnderRightStick"
"options + faceTop" = "switchState.menu"
"options + faceRight" = "switchState.textInput"
"options + quickAccess" = "rotateWindow"
"faceTop" = "toggleShift"
"faceBottom" = [
  { action = "acceptSuggestion", when = "suggestionSelected" },
  { action = "sendKey.enter" },
]
"faceRight" = { action = "cancelSuggestion", when = "suggestionSelected" }
"faceLeft" = "sendKey.backspace"
"l5" = "sendKey.backspace"
"r5" = "sendKey.space"
"l4" = "toggleShift"
"stickLeft" = "toggleCtrl"
"stickRight" = "toggleAlt"
"dpadLeft" = "sendKey.left"
"dpadRight" = "sendKey.right"
"dpadUp" = "sendKey.up"
"dpadDown" = "sendKey.down"
"shoulderLeft" = "cycleSuggestionPrev"
"shoulderRight" = "cycleSuggestion"
"options + faceLeft" = "toggleCompletion"
quickAccess = "switchState.mappings"

[Menu]
"dpadUp" = "selectUp"
"dpadDown" = "selectDown"
"faceBottom" = "activate"
"faceRight" = "switchState.keyboard"

[TextInput]
"dpadLeft" = "moveCursorLeft"
"dpadRight" = "moveCursorRight"
"dpadUp" = "switchState.keyboard"
"shoulderLeft" = "cycleSuggestionPrev"
"shoulderRight" = "cycleSuggestion"
"faceBottom" = [
  { action = "acceptSuggestion", when = "suggestionSelected" },
  { action = "submit" },
]
"faceRight" = { action = "cancelSuggestion", when = "suggestionSelected" }
"options + faceLeft" = "toggleCompletion"

[MoveWindow]
"faceRight" = "switchState.menu"
"dpadUp" = "nudgeUp"
"dpadDown" = "nudgeDown"
"dpadLeft" = "nudgeLeft"
"dpadRight" = "nudgeRight"
"faceTop" = "snapTopLeft"
"faceLeft" = "snapBottomLeft"
"faceBottom" = "snapBottomRight"
"options" = "snapTopRight"
"l4" = "flipWindowLeftRight"

[SelectLayout]
"dpadUp" = "selectUp"
"dpadDown" = "selectDown"
"faceBottom" = "activate"
"faceTop" = "togglePreview"
"faceRight" = "switchState.menu"
