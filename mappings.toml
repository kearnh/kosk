# This file tells kosk what each controller button should do. You point at it
# from config.toml with controller_map; the path is relative to that file.
#
# Each [Heading] is a screen of the app: the on-screen keyboard, settings, and
# so on. Each line maps a button (left of =) to an action on that screen (right
# of =). Action names match that screen's actions, and are the same strings used
# as keyboard layout keys. Button names ignore case, so faceBottom and
# face-bottom are the same.
#
# Two buttons joined with + are a chord. Hold the first, then press the second.
# The first button cannot also have a mapping of its own in this table; the
# second one can.
#
# One button can do different things in different situations. Write a list; the
# first entry whose when condition is true (or that has no when) is used. Put
# the default last, with no when. A single { action, when } with no fallback
# does nothing when the condition is false. Button names, action names, and
# when conditions are listed in MAPPINGS.md.
#
# The Steam Controller 2 has extra buttons: paddles l4, r4, l5, r5, and Quick
# Access (quickAccess / qam, the ⋯ between the pads). A DualShock 4 does not,
# so those bindings sit idle. How far you pull a trigger, and how the pads
# rumble, are set in [ps4] / [sc2] in config.toml.

[Keyboard]
"triggerLeft" = [
  { action = "acceptSuggestion", when = "suggestionSelected" },
  { action = "sendKeyUnderLeftStick" },
]
"triggerRight" = [
  { action = "acceptSuggestion", when = "suggestionSelected" },
  { action = "sendKeyUnderRightStick" },
]
"padLeft" = "sendKeyUnderLeftStick"
"padRight" = "sendKeyUnderRightStick"
"share + faceTop" = "switchState.settings"
"share + faceRight" = "switchState.textInput"
"share + quickAccess" = "rotateWindow"
"faceTop" = "toggleShift"
"faceBottom" = [
  { action = "acceptSuggestion", when = "suggestionSelected" },
  { action = "sendKey.enter" },
]
"faceRight" = { action = "cancelSuggestion", when = "suggestionSelected" }
"faceLeft" = "sendKey.backspace"
"l5" = [
  { action = "cancelSuggestion", when = "suggestionJustAccepted" },
  { action = "sendKey.backspace" },
]
"r5" = "sendKey.space"
"l4" = "toggleShift"
"stickLeft" = "toggleCtrl"
"stickRight" = "toggleAlt"
"dpadLeft" = "sendKey.left"
"dpadRight" = "sendKey.right"
"dpadUp" = "sendKey.up"
"dpadDown" = "sendKey.down"
"shoulderLeft" = "cycleSuggestionPrev"
"shoulderRight" = "cycleSuggestion"
"share + faceLeft" = "toggleCompletion"
quickAccess = "switchState.mappings"

[Settings]
"dpadUp" = "selectUp"
"dpadDown" = "selectDown"
"dpadLeft" = "selectLeft"
"dpadRight" = "selectRight"
"faceBottom" = "activate"
"faceRight" = "back"
"faceTop" = "toggleShowAllControllers"
"faceLeft" = "toggleShowAllSettings"
"share" = "openConfig"
"shoulderLeft" = "pagePrev"
"shoulderRight" = "pageNext"

[TextInput]
"dpadLeft" = "moveCursorLeft"
"dpadRight" = "moveCursorRight"
"dpadUp" = "switchState.keyboard"
"shoulderLeft" = "cycleSuggestionPrev"
"shoulderRight" = "cycleSuggestion"
"faceBottom" = [
  { action = "acceptSuggestion", when = "suggestionSelected" },
  { action = "submit" },
]
"faceRight" = { action = "cancelSuggestion", when = "suggestionSelected" }
"share + faceLeft" = "toggleCompletion"

[MoveWindow]
"faceBottom" = "save"
"faceRight" = "switchState.settings"

[SelectLayout]
"dpadUp" = "selectUp"
"dpadDown" = "selectDown"
"faceBottom" = "activate"
"faceTop" = "togglePreview"
"faceRight" = "switchState.settings"
