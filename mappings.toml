# Controller bindings for keyboard state (paths are relative to the main config file).
# Action names use the same `keyboard.*` strings as layout keys in `old_steam_controller_kb.toml`.
# Button names are case-insensitive; use camelCase or kebab-case (e.g. stick-left, stickLeft).
# Chords are exactly two buttons: leader + follower (press leader first). The leader cannot
# also have a standalone mapping in this table; the follower may.

[Keyboard]
"triggerLeft,threshold=40" = "sendKeyUnderLeftStick"
"faceBottom" = "sendKeyUnderLeftStick"
"triggerRight,threshold=40" = "sendKeyUnderRightStick"
"options + faceTop" = "switchState.menu"
"faceTop" = "toggleShift"
"stickLeft" = "toggleCtrl"
"stickRight" = "toggleAlt"
"faceRight" = "switchState.textInput"
"faceLeft" = "backspace"
