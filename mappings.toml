# Controller bindings per app state (paths are relative to the main config file).
# Action names match each state's action enum (same strings as keyboard layout keys).
# Button names are case-insensitive; use camelCase or kebab-case (e.g. stick-left, stickLeft).
# SC2 paddles: l4/r4 flip the OSK around the pointer (left/right, above/below);
# l5, r5 as below. SC2 Quick Access (⋯ between pads): quickAccess / qam.
# DualShock 4 has neither paddles nor Quick Access (those bindings stay idle).
# Chords are exactly two buttons: leader + follower (press leader first). The leader cannot
# also have a standalone mapping in this table; the follower may.
# Trigger thresholds and pad haptics are device feel: set them in [ps4] / [sc2] in config.toml.

[Keyboard]
# Triggers: type the key under that stick, or accept a highlighted chip.
"triggerLeft" = "sendKeyUnderLeftStickOrAcceptSuggestion"
"triggerRight" = "sendKeyUnderRightStickOrAcceptSuggestion"
"padLeft" = "sendKeyUnderLeftStick"
"padRight" = "sendKeyUnderRightStick"
"options + faceTop" = "switchState.menu"
"options + faceRight" = "switchState.textInput"
"options + quickAccess" = "rotateWindow"
"faceTop" = "toggleShift"
"faceBottom" = "enterOrAcceptSuggestion"
"faceLeft" = "sendKey.backspace"
"l5" = "sendKey.backspace"
"r5" = "sendKey.space"
"l4" = "toggleShift"
"stickLeft" = "toggleCtrl"
"stickRight" = "toggleAlt"
"dpadLeft" = "sendKey.left"
"dpadRight" = "sendKey.right"
"dpadUp" = "sendKey.up"
"dpadDown" = "sendKey.down"
"shoulderLeft" = "cycleSuggestionPrev"
"shoulderRight" = "cycleSuggestion"
"options + faceLeft" = "toggleCompletion"
quickAccess = "switchState.mappings"

[Menu]
"dpadUp" = "selectUp"
"dpadDown" = "selectDown"
"faceBottom" = "activate"
"faceRight" = "switchState.keyboard"

[TextInput]
"dpadLeft" = "moveCursorLeft"
"dpadRight" = "moveCursorRight"
"dpadUp" = "switchState.keyboard"
"shoulderLeft" = "cycleSuggestionPrev"
"shoulderRight" = "cycleSuggestion"
"faceBottom" = "enterOrAcceptSuggestion"
"options + faceLeft" = "toggleCompletion"

[MoveWindow]
"faceRight" = "switchState.menu"
"dpadUp" = "nudgeUp"
"dpadDown" = "nudgeDown"
"dpadLeft" = "nudgeLeft"
"dpadRight" = "nudgeRight"
"faceTop" = "snapTopLeft"
"faceLeft" = "snapBottomLeft"
"faceBottom" = "snapBottomRight"
"options" = "snapTopRight"
"l4" = "flipWindowLeftRight"

[SelectLayout]
"dpadUp" = "selectUp"
"dpadDown" = "selectDown"
"faceBottom" = "activate"
"faceTop" = "togglePreview"
"faceRight" = "switchState.menu"
