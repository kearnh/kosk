# Symbols layout: numbers, brackets, operators, punctuation, navigation.
pad_x = 0.125
pad_y = 0.05
font_size = 22.0
# Rest positions match the alphabet layout.
stick_rest_left = [2, 3]
stick_rest_right = [2, 9]

[stick_bounds]
left = [{ min = { x = 0.0, y = 0.0 }, max = { x = 6.95, y = 5.3 } }]
right = [{ min = { x = 7.0, y = 0.0 }, max = { x = 14.0, y = 5.3 } }]

# Numbers retain their alphabet-layout positions and shifted symbols.
[[rows]]
indent = 0.0
height = 1.0

[[rows.items]]
key = { normal = "1", shift = "!" }

[[rows.items]]
key = { normal = "2", shift = "@" }

[[rows.items]]
key = { normal = "3", shift = "#" }

[[rows.items]]
key = { normal = "4", shift = "$" }

[[rows.items]]
key = { normal = "5", shift = "%" }

[[rows.items]]
key = { normal = "6", shift = "^" }
width = 1.2

[[rows.items]]
key = "Skip"
width = 0.25

[[rows.items]]
key = { normal = "7", shift = "&" }
width = 1.2

[[rows.items]]
key = { normal = "8", shift = "*" }

[[rows.items]]
key = { normal = "9", shift = "(" }

[[rows.items]]
key = { normal = "0", shift = ")" }

[[rows.items]]
key = { normal = "-", shift = "_" }

[[rows.items]]
key = "Backspace"
display = "{icon:backspace}"

# Bracket pairs, then slashes. Shift the backslash for a vertical bar.
[[rows]]
indent = 0.0
height = 1.3

[[rows.items]]
key = "("
width = 1.4

[[rows.items]]
key = ")"

[[rows.items]]
key = "["

[[rows.items]]
key = "]"
width = 1.3

[[rows.items]]
key = { normal = "\\\\", shift = "|" }
display = { normal = "\\", shift = "|" }
width = 1.6

[[rows.items]]
key = "Skip"
width = 0.25

[[rows.items]]
key = "{"
width = 1.6

[[rows.items]]
key = "}"
width = 1.4

[[rows.items]]
key = "<"

[[rows.items]]
key = ">"

[[rows.items]]
key = "/"
width = 1.4

# Number-row symbols and operators.
[[rows]]
indent = 0.0
height = 1.1

[[rows.items]]
key = "switchState.settings"
display = "{icon:gear}"
width = 0.8
font_size = 18.0

[[rows.items]]
key = "!"

[[rows.items]]
key = "@"

[[rows.items]]
key = "#"

[[rows.items]]
key = "$"

[[rows.items]]
key = "%"
width = 1.4

[[rows.items]]
key = "Skip"
width = 0.25

[[rows.items]]
key = "^"
width = 1.5

[[rows.items]]
key = "&"

[[rows.items]]
key = "*"

[[rows.items]]
key = "="

[[rows.items]]
key = "Return"
display = "{icon:key-return}"
width = 1.8

# Punctuation and quotes.
[[rows]]
indent = 0.0
height = 0.85

[[rows.items]]
key = "toggleShift"
display = "{icon:arrow-fat-up}"

[[rows.items]]
key = ","

[[rows.items]]
key = "."

[[rows.items]]
key = ";"

[[rows.items]]
key = ":"

[[rows.items]]
key = "'"
width = 1.2

[[rows.items]]
key = "Skip"
width = 0.25

[[rows.items]]
key = "\""
width = 1.2

[[rows.items]]
key = "`"

[[rows.items]]
key = "~"

[[rows.items]]
key = "+"

[[rows.items]]
key = "?"

[[rows.items]]
key = "toggleShift"
display = "{icon:arrow-fat-up}"

# Editing keys on the left; paired navigation keys on the right.
[[rows]]
indent = 0.0
height = 0.8

[[rows.items]]
key = "Escape"
display = "Esc"
width = 2.2
font_size = 16.0

[[rows.items]]
key = "Insert"
display = "Ins"
width = 2.2
font_size = 16.0

[[rows.items]]
key = "Delete"
display = "Del"
width = 2.2
font_size = 16.0

[[rows.items]]
key = "Skip"
width = 0.25

[[rows.items]]
key = "Home"
display = "Home"
width = 1.5
font_size = 14.0

[[rows.items]]
key = "End"
display = "End"
width = 1.5
font_size = 14.0

[[rows.items]]
key = "PageUp"
display = "PgUp"
width = 1.5
font_size = 14.0

[[rows.items]]
key = "PageDown"
display = "PgDn"
width = 1.5
font_size = 14.0

[[rows]]
indent = 0.0
height = 0.8

[[rows.items]]
key = "Tab"
display = "{icon:arrow-line-right}"
font_size = 22.0

[[rows.items]]
key = " "
width = 9.1
display_modifiers = true

[[rows.items]]
key = "switchLayout.main"
display = "abc"
width = 1.0
font_size = 16.0

[[rows]]
indent = 0.0
height = 0.8

[[rows.items]]
key = "switchState.textInput"
display = "i"
width = 0.5
font_size = 16.0

[[rows.items]]
key = "toggleRecord"
display = [
    { text = "{icon:stop:fill}", when = "recording", button_color = [
        220,
        40,
        40,
        255,
    ], text_color = [
        255,
        255,
        255,
        255,
    ] },
    { text = "{icon:record:fill}" },
]
width = 0.5
font_size = 14.0

[[rows.items]]
type = "battery"
align = "right"
width = 2.0
font_size = 16.0

[[rows.items]]
type = "connectedController"
align = "right"
width = 2.0
font_size = 16.0
