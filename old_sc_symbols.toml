# Symbols layout (Steam Controller geometry)
# US ANSI punctuation missing from `main`, plus Escape/Delete/nav.
# Digits stay for muscle memory; letter rows are punctuation and nav.
# `abc` (bottom-right) returns to `main`.
pad_x = 0.125
pad_y = 0.1
font_size = 24.0
# Rest on the same home-row slots as `main` (`d` / `k`) so analog cursors do not jump.
stick_rest_left = [2, 3]
stick_rest_right = [2, 9]

[stick_bounds]
left = [{ min = { x = 0.0, y = 0.0 }, max = { x = 6.95, y = 5.0 } }]
right = [{ min = { x = 7.0, y = 0.0 }, max = { x = 14.0, y = 5.0 } }]

# Number row: Esc (US top-left), digits, =+ (US right of 0). Dropped 6/- (still on main).
[[rows]]
indent = 0.0
height = 1.0

[[rows.items]]
key = "Escape"
display = "Esc"
width = 1.2

[[rows.items]]
key = { normal = "1", shift = "!" }

[[rows.items]]
key = { normal = "2", shift = "@" }

[[rows.items]]
key = { normal = "3", shift = "#" }

[[rows.items]]
key = { normal = "4", shift = "$" }

[[rows.items]]
key = { normal = "5", shift = "%" }

[[rows.items]]
key = "Skip"
width = 0.25

[[rows.items]]
key = { normal = "7", shift = "&" }
width = 1.2

[[rows.items]]
key = { normal = "8", shift = "*" }

[[rows.items]]
key = { normal = "9", shift = "(" }

[[rows.items]]
key = { normal = "0", shift = ")" }

[[rows.items]]
key = { normal = "=", shift = "+" }

[[rows.items]]
key = "Backspace"
display = "{icon:backspace}"

# Symbol row (US letter-adjacent punctuation): `~  [ {  ] }  \ |  |  ; :  ' "  / ?
[[rows]]
indent = 0.0
height = 1.3

[[rows.items]]
key = { normal = "`", shift = "~" }
width = 1.4

[[rows.items]]
key = { normal = "[", shift = "{" }

[[rows.items]]
key = { normal = "]", shift = "}" }

[[rows.items]]
key = { normal = "\\\\", shift = "|" }
display = { normal = "\\", shift = "|" }
width = 1.3

[[rows.items]]
key = "Delete"
display = "Del"
width = 1.6

[[rows.items]]
key = "Skip"
width = 0.25

[[rows.items]]
key = { normal = ";", shift = ":" }
width = 1.6

[[rows.items]]
key = { normal = "'", shift = "\"" }
width = 1.4

[[rows.items]]
key = { normal = "/", shift = "?" }

[[rows.items]]
key = "_"

[[rows.items]]
key = "|"
width = 1.4

# Home row: nav cluster (left) and unshifted brackets (right)
[[rows]]
indent = 0.0
height = 1.1

[[rows.items]]
key = "switchState.settings"
display = "{icon:gear}"
width = 0.8
font_size = 18.0

[[rows.items]]
key = "Home"
display = "Home"
font_size = 14.0

[[rows.items]]
key = "End"
display = "End"
font_size = 14.0

[[rows.items]]
key = "PageUp"
display = "PgUp"
font_size = 14.0

[[rows.items]]
key = "PageDown"
display = "PgDn"
font_size = 14.0

[[rows.items]]
key = "Insert"
display = "Ins"
width = 1.4
font_size = 14.0

[[rows.items]]
key = "Skip"
width = 0.25

[[rows.items]]
key = "{"
width = 1.5

[[rows.items]]
key = "}"

[[rows.items]]
key = "("

[[rows.items]]
key = ")"

[[rows.items]]
key = "Return"
display = "{icon:key-return}"
width = 1.8

[[rows]]
indent = 0.0
height = 1.3

[[rows.items]]
key = "toggleShift"
display = "{icon:arrow-fat-up}"

[[rows.items]]
key = { normal = ",", shift = "<" }

[[rows.items]]
key = "!"

[[rows.items]]
key = "@"

[[rows.items]]
key = "#"

[[rows.items]]
key = "+"
width = 1.2

[[rows.items]]
key = "Skip"
width = 0.25

[[rows.items]]
key = "*"
width = 1.2

[[rows.items]]
key = "&"

[[rows.items]]
key = "~"

[[rows.items]]
key = { normal = ".", shift = ">" }

[[rows.items]]
key = "toggleShift"
display = "{icon:arrow-fat-up}"

[[rows]]
indent = 0.0
height = 1.0

[[rows.items]]
key = "Tab"
display = "{icon:arrow-line-right}"

[[rows.items]]
key = " "
width = 9.1
display_modifiers = true

[[rows.items]]
key = "switchLayout.main"
display = "abc"
width = 1.0

[[rows]]
indent = 0.0
height = 0.8

[[rows.items]]
key = "switchState.textInput"
display = "i"
width = 0.5
font_size = 16.0

[[rows.items]]
key = "toggleRecord"
display = [
    { text = "{icon:stop:fill}", when = "recording", button_color = [
        220,
        40,
        40,
        255,
    ], text_color = [
        255,
        255,
        255,
        255,
    ] },
    { text = "{icon:record:fill}" },
]
width = 0.5
font_size = 14.0

[[rows.items]]
type = "battery"
align = "right"
width = 2.0
font_size = 16.0

[[rows.items]]
type = "connectedController"
align = "right"
width = 2.0
font_size = 16.0
