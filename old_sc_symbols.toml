# Symbols layout (Steam Controller geometry)
# US ANSI punctuation missing from `main`, plus Escape/Delete.
# Digits stay for muscle memory; letter rows are punctuation.
pad_x = 0.125
pad_y = 0.1
font_size = 24.0
# Rest on ] (left pad) and ; (right pad) in the symbol row
stick_rest_left = [1, 2]
stick_rest_right = { type = "position", x = 11.0, y = 2.6 }

[stick_bounds]
left = [{ min = { x = 0.0, y = 0.0 }, max = { x = 6.95, y = 5.0 } }]
right = [{ min = { x = 7.0, y = 0.0 }, max = { x = 14.0, y = 5.0 } }]

# Number row: Esc (US top-left), digits, =+ (US right of 0). Dropped 6/- (still on main).
[[rows]]
indent = 0.0
height = 1.0

[[rows.keys]]
key = "Escape"
display = "Esc"
width = 1.2

[[rows.keys]]
key = { normal = "1", shift = "!" }

[[rows.keys]]
key = { normal = "2", shift = "@" }

[[rows.keys]]
key = { normal = "3", shift = "#" }

[[rows.keys]]
key = { normal = "4", shift = "$" }

[[rows.keys]]
key = { normal = "5", shift = "%" }

[[rows.keys]]
key = "Skip"
width = 0.25

[[rows.keys]]
key = { normal = "7", shift = "&" }
width = 1.2

[[rows.keys]]
key = { normal = "8", shift = "*" }

[[rows.keys]]
key = { normal = "9", shift = "(" }

[[rows.keys]]
key = { normal = "0", shift = ")" }

[[rows.keys]]
key = { normal = "=", shift = "+" }

[[rows.keys]]
key = "Backspace"
display = "{icon:backspace}"

# Symbol row (US letter-adjacent punctuation): `~  [ {  ] }  \ |  |  ; :  ' "  / ?
[[rows]]
indent = 0.0
height = 1.3

[[rows.keys]]
key = { normal = "`", shift = "~" }
width = 1.4

[[rows.keys]]
key = { normal = "[", shift = "{" }

[[rows.keys]]
key = { normal = "]", shift = "}" }

[[rows.keys]]
key = { normal = "\\\\", shift = "|" }
display = { normal = "\\", shift = "|" }
width = 1.3

[[rows.keys]]
key = "Delete"
display = "Del"
width = 1.6

[[rows.keys]]
key = "Skip"
width = 0.25

[[rows.keys]]
key = { normal = ";", shift = ":" }
width = 1.6

[[rows.keys]]
key = { normal = "'", shift = "\"" }
width = 1.4

[[rows.keys]]
key = { normal = "/", shift = "?" }

[[rows.keys]]
key = "Skip"

[[rows.keys]]
key = "Skip"
width = 1.4

# Home row chrome (menu / return); skips keep SC widths for stick_bounds
[[rows]]
indent = 0.0
height = 1.1

[[rows.keys]]
key = "switchState.menu"
display = "{icon:list}"
width = 0.8
font_size = 18.0

[[rows.keys]]
key = "Skip"

[[rows.keys]]
key = "Skip"

[[rows.keys]]
key = "Skip"

[[rows.keys]]
key = "Skip"

[[rows.keys]]
key = "Skip"
width = 1.4

[[rows.keys]]
key = "Skip"
width = 0.25

[[rows.keys]]
key = "Skip"
width = 1.5

[[rows.keys]]
key = "Skip"

[[rows.keys]]
key = "Skip"

[[rows.keys]]
key = "Skip"

[[rows.keys]]
key = "Return"
display = "{icon:key-return}"
width = 1.8

[[rows]]
indent = 0.0
height = 1.3

[[rows.keys]]
key = "toggleShift"
display = "{icon:arrow-fat-up}"

[[rows.keys]]
key = { normal = ",", shift = "<" }

[[rows.keys]]
key = "Skip"

[[rows.keys]]
key = "Skip"

[[rows.keys]]
key = "Skip"

[[rows.keys]]
key = "Skip"
width = 1.2

[[rows.keys]]
key = "Skip"
width = 0.25

[[rows.keys]]
key = "Skip"
width = 1.2

[[rows.keys]]
key = "Skip"

[[rows.keys]]
key = "Skip"

[[rows.keys]]
key = { normal = ".", shift = ">" }

[[rows.keys]]
key = "toggleShift"
display = "{icon:arrow-fat-up}"

[[rows]]
indent = 0.0
height = 1.0

[[rows.keys]]
key = "Tab"
display = "{icon:arrow-line-right}"

[[rows.keys]]
key = " "
width = 9.1
display_modifiers = true

[[rows]]
indent = 0.0
height = 0.8

[[rows.keys]]
key = "switchState.textInput"
display = "i"
width = 0.5
font_size = 16.0

[[rows.keys]]
key = "toggleRecord"
display = [
    { text = "{icon:stop:fill}", when = "recording", button_color = [
        220,
        40,
        40,
        255,
    ], text_color = [
        255,
        255,
        255,
        255,
    ] },
    { text = "{icon:record:fill}" },
]
width = 0.5
font_size = 14.0
