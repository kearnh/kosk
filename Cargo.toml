[workspace]
members = [".", "crates/kosk-mcp", "crates/wordlist-convert", "crates/kosk-config-derive"]
resolver = "2"

[package]
name = "kosk"
version = "0.1.0"
edition = "2021"
default-run = "kosk"

[[bin]]
name = "sc2_test"
path = "src/bin/sc2_test.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
kosk-config-derive = { path = "crates/kosk-config-derive" }
memmap2 = "0.9.11"
postcard = { version = "1.1.3", default-features = false, features = ["use-std", "alloc"] }
rayon = "1.12.0"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "inspection"] }
glob = "0.3.4"
egui = { version = "0.36.2", features = ["serde"] }
egui_extras = { version = "0.36.2", features = ["svg"] }
egui_phosphor_icons = "0.5.0"
enigo = { version = "0.6.1", features = ["serde"] }
hidapi = "2.6.7"
notify = "8.2.0"
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_plain = "1.0.2"
strum = { version = "0.28.0", features = ["derive"] }
toml = "1.1.6"
toml_edit = { version = "0.25.15", features = ["serde"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
wgpu = ["eframe/wgpu"]
