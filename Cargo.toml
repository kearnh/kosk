[workspace]
members = [".", "crates/kosk-mcp"]
resolver = "2"

[package]
name = "kosk"
version = "0.1.0"
edition = "2021"
default-run = "kosk"

[[bin]]
name = "sc2_test"
path = "src/bin/sc2_test.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.36.1", default-features = false, features = ["glow", "inspection"] }
egui = { version = "0.36.1", features = ["serde"] }
egui_phosphor_icons = "0.5"
enigo = { version = "0.6.1", features = ["serde"] }
hidapi = "2.6.5"
notify = "6.1.1"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_plain = "1.0.2"
strum = { version = "0.27", features = ["derive"] }
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
wgpu = ["eframe/wgpu"]
