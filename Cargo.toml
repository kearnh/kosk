[package]
name = "kosk"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
eframe = { version = "0.33.3", features = ["wgpu", "glow"] }
egui = "0.33.3"
enigo = "0.6.1"
hidapi = "2.6.5"
image = "0.25.10"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
windows = { version = "0.62.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
] }
